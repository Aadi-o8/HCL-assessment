[project]
name = "churnguard-ai"
version = "1.0.0"
description = "Customer churn classification on IBM Telco data"
requires-python = ">=3.11,<3.12"
dependencies = [
  "pandas>=2.2,<3", "numpy>=1.26,<2.2", "scikit-learn>=1.5,<2",
  "tensorflow>=2.18,<2.21", "joblib>=1.4", "matplotlib>=3.9",
  "seaborn>=0.13", "plotly>=5.24", "fastapi>=0.115",
  "pydantic>=2.9,<3", "uvicorn>=0.32", "streamlit>=1.40", "requests>=2.32",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "jupyter>=1.1", "ipykernel>=6.29"]

[tool.pytest.ini_options]
pythonpath = ["."]
